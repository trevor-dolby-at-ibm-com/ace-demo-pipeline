# Deploy ACE Designer front-end flows

name: ACEaaS Designer flows deploy

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  #push:
  #  branches: [ main ]
  #pull_request:
  #  branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Deploy Designer flows
        shell: bash
        env:
          APPCON_ENDPOINT:       ${{ vars.APPCON_ENDPOINT }}
          APPCON_DEPLOY_PREFIX:  ${{ vars.APPCON_DEPLOY_PREFIX }}
          APPCON_INSTANCE_ID:    ${{ secrets.APPCON_INSTANCE_ID }}
          APPCON_CLIENT_ID:      ${{ secrets.APPCON_CLIENT_ID }}
          APPCON_CLIENT_SECRET:  ${{ secrets.APPCON_CLIENT_SECRET }}
          APPCON_API_KEY:        ${{ secrets.APPCON_API_KEY }}
        run: |
          echo "Deploying Designer flows to ${APPCON_ENDPOINT}"

          # Fix for ace-minimal-build and curl
          unset LD_LIBRARY_PATH

          set -e # Fail on error - this must be done after the profile in case the container has the profile loaded already
          #set -x # Debugging

          # The script relies on the environment variables for SaaS endpoint credentials
          bash scripts/ace-saas-cli.sh get token /tmp/APPCON_TOKEN
          export APPCON_TOKEN=`cat /tmp/APPCON_TOKEN`

          bash scripts/ace-saas-cli.sh upload bar ${APPCON_DEPLOY_PREFIX}-tea-designer extensions/designer/TeaAPI.bar bar-url.txt

          echo ========================================================================
          echo Creating IntegrationRuntime JSON
          echo ========================================================================
          bash scripts/ace-saas-cli.sh create ir ${APPCON_DEPLOY_PREFIX}-tea-designer-ir `cat bar-url.txt` default-switch-server-privatenetworkagent
