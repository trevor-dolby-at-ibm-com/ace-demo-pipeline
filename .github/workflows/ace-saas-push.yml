# 

name: ACE SaaS build and deploy

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  # Disable temporarily during workflow development
  #push:
  #  branches: [ main ]
  #pull_request:
  #  branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container: 
      image: tdolby/experimental:ace-minimal-13.0.9.0-alpine
      env:
        LICENSE: accept
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Build the application and test it
        shell: bash
        run: |
          echo "Loading ACE profile"
          export LICENSE=accept
          set +e # Don't fail on error if the profile has already been loaded
          . /opt/ibm/ace-13/server/bin/mqsiprofile
          set -e # Fail on error - this must be done after the profile in case the container has the profile loaded already

          echo ========================================================================
          echo Building application
          echo ========================================================================
          # Using --compile-maps-and-schemas for 13.0.1 and later . . . 
          ibmint package --input-path . --output-bar-file $PWD/tea-application-combined.bar --project TeaSharedLibraryJava --project TeaSharedLibrary --project TeaRESTApplication --project TeaCallableApplicationV2 --compile-maps-and-schemas 

          echo ========================================================================
          echo Building unit tests
          echo ========================================================================
          # Create the unit test work directory
          mqsicreateworkdir /tmp/test-work-dir
          mqsibar -w /tmp/test-work-dir -a $PWD/tea-application-combined.bar 
          # Build just the unit tests
          ibmint deploy --input-path . --output-work-directory /tmp/test-work-dir --project TeaRESTApplication_UnitTest

          echo ========================================================================
          echo Running unit tests
          echo ========================================================================
          IntegrationServer -w /tmp/test-work-dir --no-nodejs --start-msgflows false --test-project TeaRESTApplication_UnitTest --test-junit-options --reports-dir=junit-reports

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tea-application-combined.bar
          path: tea-application-combined.bar

  deploy:
    needs: build
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # 2. Download the artifact to the new runner
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: tea-application-combined.bar

      - name: Deploy flows
        shell: bash
        env:
          APPCON_ENDPOINT:       ${{ vars.APPCON_ENDPOINT }}
          APPCON_DEPLOY_PREFIX:  ${{ vars.APPCON_DEPLOY_PREFIX }}
          APPCON_INSTANCE_ID:    ${{ secrets.APPCON_INSTANCE_ID }}
          APPCON_CLIENT_ID:      ${{ secrets.APPCON_CLIENT_ID }}
          APPCON_CLIENT_SECRET:  ${{ secrets.APPCON_CLIENT_SECRET }}
          APPCON_API_KEY:        ${{ secrets.APPCON_API_KEY }}
        run: |
          echo "Deploying flows to ${APPCON_ENDPOINT}"

          # Fix for ace-minimal-build and curl
          unset LD_LIBRARY_PATH
          
          set -e # Fail on error - this must be done after the profile in case the container has the profile loaded already
          #set -x # Debugging


          # The script relies on the environment variables for SaaS endpoint credentials
          bash scripts/ace-saas-cli.sh get token /tmp/APPCON_TOKEN
          export APPCON_TOKEN=`cat /tmp/APPCON_TOKEN`

          bash scripts/ace-saas-cli.sh upload bar tdolby-tea-application tea-application-combined.bar /tmp/BARURL

          exit 0

          echo "########################################################################"
          echo "# Checking for IntegrationRuntime"
          echo "########################################################################" && echo
          # Avoid failing immediately if the grep commands find errors
          set +e
          curl -s https://${APPCON_ENDPOINT}/api/v1/integration-runtimes/${APPCON_DEPLOY_PREFIX}-rest-call-ir \
            -H "x-ibm-instance-id: ${APPCON_INSTANCE_ID}" -H "Content-Type: application/octet-stream" \
            -H "Accept: application/json" -H "X-IBM-Client-Id: ${APPCON_CLIENT_ID}" -H "authorization: Bearer `cat /tmp/APPCON_TOKEN`" \
            --output /tmp/curl-output.txt
          #cat /tmp/curl-output.txt ; echo
          # Check for 404 Not Found
          grep -q '"Internal error","code":404' /tmp/curl-output.txt
          if [ "$?" != "0" ]; then
              # IR found or else another error
              # Look for an expected string to check for a valid IR
              grep -q supportsTraceCustomResource /tmp/curl-output.txt
              if [ "$?" != "0" ]; then
                echo "########################################################################"
                echo "# Error detecting ACEaaS IR"
                echo "########################################################################" && echo
                cat /tmp/curl-output.txt
                exit 1
              fi
              echo "########################################################################"
              echo "# Found existing IR"
              echo "########################################################################" && echo
          else
            echo "########################################################################"
            echo "# Creating IntegrationRuntime JSON"
            echo "########################################################################" && echo
            set -e
            cp extensions/create-integrationruntime-template.json /tmp/create-integrationruntime.json
            sed -i "s/TEMPLATE_NAME/${APPCON_DEPLOY_PREFIX}-rest-call-ir/g" /tmp/create-integrationruntime.json
            # Backslash issues - the effect is to escape / characters in the URL data to avoid issues with sed
            sed -i "s/TEMPLATE_BARURL/`cat /tmp/BARURL | sed 's|/|\\\\/|g'`/g" /tmp/create-integrationruntime.json
            echo "Contents of create-integrationruntime.json:"
            cat /tmp/create-integrationruntime.json

            curl -s --fail-with-body -X PUT https://${APPCON_ENDPOINT}/api/v1/integration-runtimes/${APPCON_DEPLOY_PREFIX}-rest-call-ir \
              -H "x-ibm-instance-id: ${APPCON_INSTANCE_ID}" -H "Content-Type: application/json" \
              -H "Accept: application/json" -H "X-IBM-Client-Id: ${APPCON_CLIENT_ID}" -H "authorization: Bearer `cat /tmp/APPCON_TOKEN`" \
              --data-binary @/tmp/create-integrationruntime.json
          fi
