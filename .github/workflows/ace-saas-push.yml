name: ACE SaaS build and deploy

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  # Disable temporarily during workflow development
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      create_config:
        description: 'True to create IR and JDBC config (requires JDBC* secrets)'
        required: true
        type: boolean
        default: false

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container: 
      image: tdolby/experimental:ace-minimal-13.0.9.0-alpine
      env:
        LICENSE: accept
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Build the application and test it
        shell: bash
        run: |
          echo "Loading ACE profile"
          export LICENSE=accept
          set +e # Don't fail on error if the profile has already been loaded
          . /opt/ibm/ace-13/server/bin/mqsiprofile
          set -e # Fail on error - this must be done after the profile in case the container has the profile loaded already

          echo ========================================================================
          echo Building application
          echo ========================================================================
          # Using --compile-maps-and-schemas for 13.0.1 and later . . . 
          ibmint package --input-path . --output-bar-file $PWD/tea-application-combined.bar --project TeaSharedLibraryJava --project TeaSharedLibrary --project TeaRESTApplication --project TeaCallableApplicationV2 --compile-maps-and-schemas 

          echo ========================================================================
          echo Building unit tests
          echo ========================================================================
          # Create the unit test work directory
          mqsicreateworkdir /tmp/test-work-dir
          mqsibar -w /tmp/test-work-dir -a $PWD/tea-application-combined.bar 
          # Build just the unit tests
          ibmint deploy --input-path . --output-work-directory /tmp/test-work-dir --project TeaRESTApplication_UnitTest

          echo ========================================================================
          echo Running unit tests
          echo ========================================================================
          IntegrationServer -w /tmp/test-work-dir --no-nodejs --start-msgflows false --test-project TeaRESTApplication_UnitTest --test-junit-options --reports-dir=junit-reports

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tea-application-combined.bar
          path: tea-application-combined.bar

  deploy:
    needs: build
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # 2. Download the artifact to the new runner
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: tea-application-combined.bar

      - name: Deploy flows
        shell: bash
        env:
          APPCON_ENDPOINT:       ${{ vars.APPCON_ENDPOINT }}
          APPCON_DEPLOY_PREFIX:  ${{ vars.APPCON_DEPLOY_PREFIX }}
          APPCON_INSTANCE_ID:    ${{ secrets.APPCON_INSTANCE_ID }}
          APPCON_CLIENT_ID:      ${{ secrets.APPCON_CLIENT_ID }}
          APPCON_CLIENT_SECRET:  ${{ secrets.APPCON_CLIENT_SECRET }}
          APPCON_API_KEY:        ${{ secrets.APPCON_API_KEY }}
        run: |
          echo "Deploying flows to ${APPCON_ENDPOINT}"

          # Fix for ace-minimal-build and curl
          unset LD_LIBRARY_PATH

          set -e # Fail on error - this must be done after the profile in case the container has the profile loaded already
          #set -x # Debugging

          # The script relies on the environment variables for SaaS endpoint credentials
          bash scripts/ace-saas-cli.sh get token /tmp/APPCON_TOKEN
          export APPCON_TOKEN=`cat /tmp/APPCON_TOKEN`

          bash scripts/ace-saas-cli.sh upload bar ${APPCON_DEPLOY_PREFIX}-tea-application tea-application-combined.bar bar-url.txt

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: bar-url.txt
          path: bar-url.txt

  config:
    needs: deploy
    if: ${{ inputs.create_config }}
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # 2. Download the artifact to the new runner
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: bar-url.txt

      - name: Create config
        shell: bash
        env:
          APPCON_ENDPOINT:       ${{ vars.APPCON_ENDPOINT }}
          APPCON_DEPLOY_PREFIX:  ${{ vars.APPCON_DEPLOY_PREFIX }}
          APPCON_INSTANCE_ID:    ${{ secrets.APPCON_INSTANCE_ID }}
          APPCON_CLIENT_ID:      ${{ secrets.APPCON_CLIENT_ID }}
          APPCON_CLIENT_SECRET:  ${{ secrets.APPCON_CLIENT_SECRET }}
          APPCON_API_KEY:        ${{ secrets.APPCON_API_KEY }}
          JDBC_DATABASE_NAME:    ${{ vars.JDBC_DATABASE_NAME }}
          JDBC_HOSTNAME:         ${{ vars.JDBC_HOSTNAME }}
          JDBC_PORT:             ${{ vars.JDBC_PORT }}
          JDBC_USERNAME:         ${{ secrets.JDBC_USERNAME }}
          JDBC_PASSWORD:         ${{ secrets.JDBC_PASSWORD }}
        run: |
          echo "Creating configuration for ${APPCON_ENDPOINT}"

          # Fix for ace-minimal-build and curl
          unset LD_LIBRARY_PATH

          set -e # Fail on error - this must be done after the profile in case the container has the profile loaded already
          #set -x # Debugging

          # The script relies on the environment variables for SaaS endpoint credentials
          bash scripts/ace-saas-cli.sh get token /tmp/APPCON_TOKEN
          export APPCON_TOKEN=`cat /tmp/APPCON_TOKEN`


          echo ========================================================================
          echo Creating ${APPCON_DEPLOY_PREFIX}-jdbc-policies configuration
          echo ========================================================================
          mkdir /tmp/JDBCPolicies
          cat demo-infrastructure/TEAJDBC.policyxml | sed "s/DATABASE_NAME/${JDBC_DATABASE_NAME}/g" > /tmp/JDBCPolicies/TEAJDBC.policyxml
          sed -i "s/SERVER_NAME/${JDBC_HOSTNAME}/g" /tmp/JDBCPolicies/TEAJDBC.policyxml
          sed -i "s/PORT_NUMBER/${JDBC_PORT}/g" /tmp/JDBCPolicies/TEAJDBC.policyxml
          echo '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><ns2:policyProjectDescriptor xmlns="http://com.ibm.etools.mft.descriptor.base" xmlns:ns2="http://com.ibm.etools.mft.descriptor.policyProject"><references/></ns2:policyProjectDescriptor>' > /tmp/JDBCPolicies/policy.descriptor
          cat /tmp/JDBCPolicies/TEAJDBC.policyxml
          # Using "zip" would be more obvious, but not all ACE images have it available.
          (cd /tmp && jar cvf /tmp/JDBCPolicies.zip JDBCPolicies)
          bash scripts/ace-saas-cli.sh upload configuration ${APPCON_DEPLOY_PREFIX}-jdbc-policies policyproject "JDBC policies for ${APPCON_DEPLOY_PREFIX} Tea app" /tmp/JDBCPolicies.zip

          echo ========================================================================
          echo Creating jdbc::tea as ${APPCON_DEPLOY_PREFIX}-jdbc-setdbparms configuration
          echo ========================================================================
          echo -n jdbc::tea ${JDBC_USERNAME} ${JDBC_PASSWORD} > /tmp/jdbc-setdbparms.txt
          bash scripts/ace-saas-cli.sh upload configuration ${APPCON_DEPLOY_PREFIX}-jdbc-setdbparms setdbparms "JDBC credentials for ${APPCON_DEPLOY_PREFIX} Tea app" /tmp/jdbc-setdbparms.txt

          echo ========================================================================
          echo Creating default policy project setting as ${APPCON_DEPLOY_PREFIX}-default-policy-project configuration
          echo ========================================================================
          (echo "Defaults:" && echo "  policyProject: 'JDBCPolicies'") > /tmp/default-policy-project.txt
          bash scripts/ace-saas-cli.sh upload configuration ${APPCON_DEPLOY_PREFIX}-default-policy-project serverconf "Default policy project for ${APPCON_DEPLOY_PREFIX} Tea app" /tmp/default-policy-project.txt

          echo ========================================================================
          echo Creating IntegrationRuntime JSON
          echo ========================================================================
          bash scripts/ace-saas-cli.sh create ir ${APPCON_DEPLOY_PREFIX}-tea-gh-actions-ir `cat bar-url.txt` ${APPCON_DEPLOY_PREFIX}-default-policy-project ${APPCON_DEPLOY_PREFIX}-jdbc-setdbparms ${APPCON_DEPLOY_PREFIX}-jdbc-policies default-switch-server-privatenetworkagent
