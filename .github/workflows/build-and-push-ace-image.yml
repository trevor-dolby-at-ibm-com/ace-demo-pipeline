name: Build and push ACE image

on:
  push:
    branches: [ ace-image-build ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the image
        env:
          ACE_DOWNLOAD_URL: ${{ vars.ACE_DOWNLOAD_URL  }}
        run: |
          git clone https://github.com/ot4i/ace-docker.git
          cd ace-docker
          docker build --file Dockerfile --build-arg "DOWNLOAD_URL=${ACE_DOWNLOAD_URL}" -t tdolby/experimental:github-action-ace-latest .

      - name: Push the image
        run: |
          docker push tdolby/experimental:github-action-ace-latest
